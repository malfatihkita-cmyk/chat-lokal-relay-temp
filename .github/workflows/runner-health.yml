name: Runner Health Probe

on:
  push:
    paths:
      - relay/runner-health.txt
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: List self-hosted runners
        uses: actions/github-script@v7
        with:
          script: |
            const r = await github.rest.actions.listSelfHostedRunnersForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100
            });
            console.log(JSON.stringify(r.data, null, 2));
